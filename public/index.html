<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="application-name" content="Gawin" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Gawin" />
    <meta name="description" content="A minimalist, offline-first task app focused on today." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#fbfbf9" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        width: 100%;
        max-width: 100%;
        height: 100%;
        overflow: hidden;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        position: fixed;
        inset: 0;
        overflow: hidden;
        margin: 0;
        background: #fbfbf9;
        overscroll-behavior: none;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        width: 100%;
        max-width: 100%;
        height: 100%;
        flex: 1;
        overflow: hidden;
      }
      input,
      textarea,
      button,
      [role='button'] {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      button *,
      [role='button'] * {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      input:focus,
      textarea:focus {
        outline: none !important;
      }
    </style>
    <script>
      const canUseServiceWorker =
        location.protocol === 'https:' ||
        location.hostname === 'localhost' ||
        location.hostname === '127.0.0.1';

      if ('serviceWorker' in navigator && canUseServiceWorker) {
        let isRefreshing = false;

        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (isRefreshing) {
            return;
          }

          isRefreshing = true;
          window.location.reload();
        });

        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js', { updateViaCache: 'none' })
            .then((registration) => registration.update())
            .catch(() => undefined);
        });
      }
    </script>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
